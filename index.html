<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
  #screen{position:relative;width:100vw;max-width:100vw;aspect-ratio:710/1536;max-height:100dvh;height:auto;}
  /* Hide the status bar baked into the reference screenshots. */
  #screen:before{content:"";position:absolute;z-index:4;left:0;right:0;top:0;height:118px;
    background:linear-gradient(to bottom,rgba(0,0,0,.02),rgba(0,0,0,0));pointer-events:none;}
  canvas{display:block;width:100%;height:100%;}
  #hint{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);
         color:rgba(255,255,255,.78);font-size:12px;padding:7px 12px;border-radius:20px;
         background:rgba(0,0,0,.32);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
         opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
  #hint.show{opacity:1}
  #setup{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
          background:rgba(0,0,0,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:20}
  #setup .card{width:min(310px,82vw);padding:22px;border-radius:24px;background:rgba(35,35,40,.92);
                color:white;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  #setup h2{font-size:19px;margin:0 0 8px}
  #setup p{font-size:14px;line-height:1.35;color:#ddd;margin:0 0 17px}
  #setup button{border:0;border-radius:14px;padding:12px 18px;font-size:16px;background:#fff;color:#111}
  @media (orientation:landscape){#screen{height:100dvh;width:auto}}
</style>
</head>

function drawBase(page=currentPage){
  if(!images[page].complete) return;
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(images[page],0,0,W,H);
  // Remove the status bar baked into the screenshot.
  // We use the nearby wallpaper strip immediately below it to reconstruct the top.
  const topH=118;
  ctx.save();
  ctx.filter="blur(1px)";
  ctx.drawImage(images[page],0,topH,W,topH,0,0,W,topH);
  ctx.restore();
  drawTransformed(page);
}

function hitTest(x,y,page=currentPage){
  let best=null, bestD=9999;
  for(let i=0;i<pages[page].length;i++){
    const [cx,cy,name,kind]=pages[page][i];
    // Do not make the dock or tiny edges overly difficult to hit.
    const rx=kind==="dock"?72:66;
    const ry=kind==="dock"?72:70;
    const d=((x-cx)/rx)**2+((y-cy)/ry)**2;
    if(d<=1 && d<bestD){best={page,index:i,cx,cy,name,kind,id:page+"-"+i};bestD=d;}
  }
  return best;
}

function roundedClipIcon(source,cx,cy){
  ctx.save();
  ctx.beginPath();
  const x=cx-62,y=cy-62,w=124,h=124,r=27;
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
  ctx.clip();
  ctx.drawImage(source,x,y,124,124,x,y,124,124);
  ctx.restore();
}

function drawLabel(text,cx,cy){
  ctx.save();
  ctx.font='20px -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='top';
  ctx.fillStyle='rgba(255,255,255,.98)';
  ctx.shadowColor='rgba(0,0,0,.8)';
  ctx.shadowBlur=3;
  ctx.shadowOffsetY=1;
  ctx.fillText(text,cx,cy+67);
  ctx.restore();
}

function blurOldLabel(cx,cy){
  // Re-draw a tiny blurred copy of the original label area. This softens the old
  // text without putting a visible rectangular patch over the wallpaper.
  const off=document.createElement("canvas");
  off.width=180; off.height=48;
  const o=off.getContext("2d");
  o.filter="blur(4px)";
  o.drawImage(images[currentPage],cx-90,cy+58,180,48,0,0,180,48);
  ctx.save();
  ctx.globalAlpha=.92;
  ctx.drawImage(off,cx-90,cy+58);
  ctx.restore();
}


function coverIconWithSelected(page, item, target){
  const [cx,cy,name,kind]=item;
  const source=images[target.page];
  const [sx,sy]=pages[target.page][target.index];
  // Copy only the icon area from the chosen app, then redraw the label.
  // This replaces the complete icon instead of merely changing text.
  ctx.save();
  const size = kind==="dock" ? 124 : 124;
  const x=cx-size/2, y=cy-size/2;
  ctx.beginPath();
  const r=28;
  ctx.moveTo(x+r,y); ctx.arcTo(x+size,y,x+size,y+r,r);
  ctx.arcTo(x+size,y+size,x+size-r,y+size,r);
  ctx.arcTo(x,y+size,x,y+size-r,r);
  ctx.arcTo(x,y,x+r,y,r); ctx.closePath(); ctx.clip();
  ctx.drawImage(source,sx-62,sy-62,124,124,x,y,size,size);
  ctx.restore();
  if(kind!=="dock"){
    // Restore the exact pixels from the ORIGINAL screenshot in the label area.
    // This removes the old app name completely before drawing the new one.
    const labelW = 180, labelH = 48;
    const lx = Math.max(0, Math.min(W-labelW, Math.round(cx-labelW/2)));
    const ly = Math.max(0, Math.min(H-labelH, Math.round(cy+58)));
    ctx.drawImage(images[page], lx, ly, labelW, labelH, lx, ly, labelW, labelH);
    drawLabel(target.name,cx,cy);
  }
}

function drawTransformed(page){
  for(const id of transformed){
    const [p,ii]=id.split("-").map(Number);
    if(p!==page) continue;
    const item=pages[p][ii];
    if(!item) continue;
    const [cx,cy,name,kind]=item;
    const target=selected;
    if(!target) continue;
    const source=images[target.page];
    const [sx,sy]=pages[target.page][target.index];
    coverIconWithSelected(page, item, target);
    }
  }
}

function render(){
  drawBase(currentPage);
  requestAnimationFrame(render);
}
images[0].onload=()=>{drawBase(0);};
images[1].onload=()=>{drawBase(currentPage);};

function shuffle(a){
  const b=a.slice();
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
  return b;
}

function startTrick(target){
  if(running) return;
  selected=target;
  running=true;
  transformed.clear();
  // Ask for motion permission from the same user gesture if iOS requires it.
  prepareMotion(false);
  setTimeout(()=>{
    const all=[];
    pages.forEach((pg,p)=>pg.forEach((_,i)=>all.push(p+"-"+i)));
    const order=shuffle(all);
    order.forEach((id,n)=>{
      setTimeout(()=>{
        if(!running) return;
        transformed.add(id);
      },n*135);
    });
  },6000);
}

function resetMagic(){
  running=false;
  transformed.clear();
  selected=null;
  drawBase(currentPage);
}

function showSetup(){
  setup.style.display="flex";
}

async function prepareMotion(showIfNeeded=true){
  if(shakeReady) return true;
  try{
    if(typeof DeviceMotionEvent!=="undefined" &&
       typeof DeviceMotionEvent.requestPermission==="function"){
      const p=await DeviceMotionEvent.requestPermission();
      if(p!=="granted"){
        if(showIfNeeded) showSetup();
        return false;
      }
    }
    if(!motionHandler){
      motionHandler=(e)=>{
        if(!running) return;
        const a=e.accelerationIncludingGravity;
        if(!a) return;
        const x=a.x||0,y=a.y||0,z=a.z||0;
        const mag=Math.sqrt(x*x+y*y+z*z);
        const now=Date.now();
        if(mag>22 && now-shakeLast>550){
          shakeLast=now;
          resetMagic();
        }
      };
      window.addEventListener("devicemotion",motionHandler,true);
    }
    shakeReady=true;
    return true;
  }catch(e){
    if(showIfNeeded) showSetup();
    return false;
  }
}

motionBtn.addEventListener("click",async()=>{
  const ok=await prepareMotion(false);
  setup.style.display="none";
  if(!ok) hint.textContent="La sacudida no está disponible; usa el gesto secreto de reinicio.";
  else hint.textContent="Sacudida activada";
  hint.classList.add("show");
  setTimeout(()=>hint.classList.remove("show"),1500);
});

// Five quick taps on the status/battery area opens the private setup.
function privateSetup(x,y){
  if(y<115 && x>500){
    const now=Date.now();
    topTapTimes=topTapTimes.filter(t=>now-t<1200);
    topTapTimes.push(now);
    if(topTapTimes.length>=5){topTapTimes=[];showSetup();}
  }
}

canvas.addEventListener("touchstart",(e)=>{
  const t=e.changedTouches[0];
  const r=canvas.getBoundingClientRect();
  const x=(t.clientX-r.left)*W/r.width;
  const y=(t.clientY-r.top)*H/r.height;
  touchStart={x,y,tx:t.clientX,ty:t.clientY,time:Date.now()};
},{passive:false});

canvas.addEventListener("touchend",(e)=>{
  e.preventDefault();
  if(!touchStart) return;
  const t=e.changedTouches[0];
  const r=canvas.getBoundingClientRect();
  const x=(t.clientX-r.left)*W/r.width;
  const y=(t.clientY-r.top)*H/r.height;
  const dx=t.clientX-touchStart.tx;
  const dy=t.clientY-touchStart.ty;
  const dt=Date.now()-touchStart.time;
  if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)*1.25){
    currentPage=dx<0?1:0;
    drawBase(currentPage);
    touchStart=null;
    return;
  }
  if(Math.abs(dx)<18 && Math.abs(dy)<18 && dt<550){
    privateSetup(x,y);
    const hit=hitTest(x,y);
    if(hit){
      const now=Date.now();
      if(lastTapId===hit.id && now-lastTapTime<520){
        startTrick(hit);
        lastTapId=null;
        lastTapTime=0;
      }else{
        selected=hit;
        lastTapId=hit.id;
        lastTapTime=now;
      }
    }
  }
  touchStart=null;
},{passive:false});

// Desktop fallback for testing.
window.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowRight"){currentPage=1;}
  if(e.key==="ArrowLeft"){currentPage=0;}
  if(e.key.toLowerCase()==="r"){resetMagic();}
});

hint.textContent="Toca una app y vuelve a tocarla rápidamente";
// hint oculto en la versión final
render();
</script>
