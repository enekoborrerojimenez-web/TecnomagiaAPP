const c=document.getElementById('c'),ctx=c.getContext('2d');
let page=0, selected=null, running=false, transformed=new Set();
let secretTaps=[], armedUntil=0, lastTap=0, lastHit=null, touch=null, shakeLast=0, motionBound=false;

function fitSource(img){
  ctx.drawImage(img,0,0,W,H);
  // Hide the old status bar from the screenshot. On a Home Screen web app,
  // iOS supplies the real status bar in the safe-area above this content.
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.28)';
  ctx.fillRect(0,0,W,92);
  ctx.restore();
}

function roundedImage(img,sx,sy,cx,cy,size=120){
  const x=cx-size/2,y=cy-size/2;
  ctx.save();
  ctx.beginPath();
  const r=27;
  ctx.moveTo(x+r,y);ctx.arcTo(x+size,y,x+size,y+r,r);
  ctx.arcTo(x+size,y+size,x+size-r,y+size,r);
  ctx.arcTo(x,y+size,x,y+size-r,r);
  ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();ctx.clip();
  ctx.drawImage(img,sx-60,sy-60,120,120,x,y,size,size);
  ctx.restore();
}

function coverOldLabel(cx,cy){
  // A localized frosted copy of the original label area makes the screenshot's
  // old text disappear without a hard rectangular patch.
  const x=Math.max(0,Math.round(cx-86)), y=Math.max(0,Math.round(cy+61));
  const w=Math.min(172,W-x), h=42;
  const tmp=document.createElement('canvas'); tmp.width=w; tmp.height=h;
  const t=tmp.getContext('2d');
  t.drawImage(imgs[page],x,y,w,h,0,0,w,h);
  t.filter='blur(9px)';
  const blurred=document.createElement('canvas'); blurred.width=w; blurred.height=h;
  const b=blurred.getContext('2d'); b.filter='blur(9px)';
  b.drawImage(imgs[page],x,y,w,h,0,0,w,h);
  ctx.save();
  ctx.globalAlpha=.98;
  ctx.drawImage(blurred,x,y);
  ctx.restore();
}

function label(text,cx,cy){
  ctx.save();
  ctx.font='20px -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillStyle='white';
  ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=3;ctx.shadowOffsetY=1;
  ctx.fillText(text,cx,cy+67);
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  fitSource(imgs[page]);
  // In the normal state the screenshot is untouched apart from the status strip.
  // In the transformed state, replace each icon and its label.
  for(const id of transformed){
    const [p,i]=id.split(':').map(Number);
    if(p!==page) continue;
    const item=pageData[p][i]; if(!item||!selected) continue;
    const [cx,cy]=item;
    const [sx,sy]=pageData[selected.p][selected.i];
    // Cover the old label first.
    if(cy<1380) coverOldLabel(cx,cy);
    roundedImage(imgs[selected.p],sx,sy,cx,cy,120);
    if(cy<1380) label(selected.name,cx,cy);
  }
  requestAnimationFrame(draw);
}

function hit(x,y){
  const arr=pageData[page];
  let best=null,d=1e9;
  for(let i=0;i<arr.length;i++){
    const [cx,cy,name]=arr[i];
    const r=cy>1300?70:68;
    const q=((x-cx)/r)**2+((y-cy)/r)**2;
    if(q<=1 && q<d){d=q;best={p:page,i,cx,cy,name};}
  }
  return best;
}

function armSecret(){
  const now=Date.now();
  secretTaps=secretTaps.filter(t=>now-t<1800);
  secretTaps.push(now);
  if(secretTaps.length>=4){armedUntil=now+3500;secretTaps=[];}
}

function startTrick(target){
  if(running)return;
  selected=target; running=true; transformed.clear();
  requestMotion();
  setTimeout(()=>{
    if(!running)return;
    const all=[];
    pageData.forEach((pg,p)=>pg.forEach((_,i)=>all.push(p+':'+i)));
    for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]];}
    all.forEach((id,n)=>setTimeout(()=>{if(running)transformed.add(id)},n*145));
  },6000);
}

function reset(){
  running=false;selected=null;transformed.clear();
}

async function requestMotion(){
  if(motionBound)return;
  try{
    if(typeof DeviceMotionEvent!=='undefined' && typeof DeviceMotionEvent.requestPermission==='function'){
      const r=await DeviceMotionEvent.requestPermission();
      if(r!=='granted')return;
    }
    window.addEventListener('devicemotion',e=>{
      if(!running)return;
      const a=e.accelerationIncludingGravity;if(!a)return;
      const m=Math.hypot(a.x||0,a.y||0,a.z||0);
      const now=Date.now();
      if(m>22 && now-shakeLast>550){shakeLast=now;reset();}
    },true);
    motionBound=true;
  }catch(e){}
}

c.addEventListener('touchstart',e=>{
  const t=e.changedTouches[0],r=c.getBoundingClientRect();
  touch={sx:t.clientX,sy:t.clientY,x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height,time:Date.now()};
},{passive:false});

c.addEventListener('touchend',e=>{
  e.preventDefault();if(!touch)return;
  const t=e.changedTouches[0],r=c.getBoundingClientRect();
  const x=(t.clientX-r.left)*W/r.width,y=(t.clientY-r.top)*H/r.height;
  const dx=t.clientX-touch.sx,dy=t.clientY-touch.sy,dt=Date.now()-touch.time;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.2){
    page=dx<0?1:0;touch=null;return;
  }
  if(Math.abs(dx)<20&&Math.abs(dy)<20&&dt<550){
    // Four secret taps in the top-left corner, then one app tap.
    if(x<115&&y<180){armSecret();touch=null;return;}
    const h=hit(x,y);
    if(h && Date.now()<armedUntil){armedUntil=0;startTrick(h);}
  }
  touch=null;
},{passive:false});

document.addEventListener('visibilitychange',()=>{if(document.hidden)reset();});
Promise.all(imgs.map(im=>new Promise(r=>im.onload=r))).then(()=>draw());
</script>
